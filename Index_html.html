<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{margin:0}</style>
<title>Piehler Academy Today</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Barlow+Condensed:wght@300;400;500;600&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#FFFFFF; --ink:#16181B; --soft:#3C4248; --muted:#7A838C; --faint:#A9B1B8;
  --rule:#D9DDE1; --rule-strong:#16181B;
  --slate:#5A7896; --slate-ink:#3D5A78; --tint:#EDF3F9; --tint-strong:#E1EAF4;
  --hatch:#E9ECEF; --past:.38;
  --live-fill:#5A7896; --live-text:#FFFFFF;
  --now-fill:#16181B; --now-text:#FFFFFF; --now-row:#F6F8FA;
  --display:"Oswald","Arial Narrow",Impact,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#101316; --ink:#ECEFF2; --soft:#C3CAD1; --muted:#8B959F; --faint:#5C6670;
    --rule:#262C32; --rule-strong:#ECEFF2;
    --slate:#8EAFCF; --slate-ink:#A9C4DE; --tint:#17212B; --tint-strong:#1D2935;
    --hatch:#1B2025;
    --live-fill:#6D8FB2; --live-text:#0B1117;
    --now-fill:#ECEFF2; --now-text:#101316; --now-row:#171C21;
  }
}
:root[data-theme="dark"]{
  --paper:#101316; --ink:#ECEFF2; --soft:#C3CAD1; --muted:#8B959F; --faint:#5C6670;
  --rule:#262C32; --rule-strong:#ECEFF2;
  --slate:#8EAFCF; --slate-ink:#A9C4DE; --tint:#17212B; --tint-strong:#1D2935;
  --hatch:#1B2025;
  --live-fill:#6D8FB2; --live-text:#0B1117;
  --now-fill:#ECEFF2; --now-text:#101316; --now-row:#171C21;
}
html,body{height:100%}
html{font-size:clamp(15px,0.725vw + 7.45px,30px)}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.35;-webkit-font-smoothing:antialiased}
.wrap{padding-inline:clamp(1rem,2.6vw,2.5rem);padding-block:1.1rem 0.9rem;display:flex;flex-direction:column;gap:0.9rem;height:100%;box-sizing:border-box}

/* ── masthead ── */
.eyebrow{font-family:var(--cond);font-weight:500;font-size:0.8rem;letter-spacing:.22em;text-transform:uppercase;color:var(--slate)}
.mast{display:grid;grid-template-columns:1fr auto;align-items:end;gap:1rem 2rem;padding-bottom:0.7rem;border-bottom:2px solid var(--rule-strong)}
.mast-left{display:flex;flex-direction:column;gap:0.3rem;min-width:0}
.dayname{font-family:var(--display);font-weight:700;font-size:3.9rem;line-height:.92;letter-spacing:-.005em;text-transform:uppercase;margin:0}
.subline{font-family:var(--cond);font-weight:300;font-size:1.12rem;color:var(--soft);letter-spacing:.01em}
.subline b{font-weight:500;color:var(--ink)}
.mast-right{display:flex;flex-direction:column;align-items:flex-end;gap:0.55rem}
.clock{font-family:var(--display);font-weight:500;font-size:3.6rem;line-height:.9;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.clock small{font-family:var(--cond);font-weight:500;font-size:.36em;letter-spacing:.14em;color:var(--muted);margin-left:.35rem}
.days{display:flex;gap:0.2rem}
.days button{font-family:var(--cond);font-weight:500;font-size:1rem;letter-spacing:.16em;text-transform:uppercase;background:transparent;color:var(--muted);border:0;border-bottom:2px solid transparent;padding:0.2rem 0.55rem 0.25rem;cursor:pointer;min-height:2rem}
.days button:hover{color:var(--ink)}
.days button.is-today{color:var(--ink)}
.days button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--rule-strong)}
.days button:focus-visible{outline:2px solid var(--slate);outline-offset:2px}
.facts{font-family:var(--cond);font-size:1rem;color:var(--muted);letter-spacing:.02em;text-align:right}

.banner{font-family:var(--cond);font-size:1.05rem;letter-spacing:.04em;color:var(--slate-ink);background:var(--tint);padding:0.45rem 0.8rem}

/* ── now box with registration marks ── */
.nowbox{position:relative;border:1px solid var(--rule);display:grid;grid-template-columns:1fr 1fr}
.nowbox[hidden]{display:none}
.mark{position:absolute;width:1rem;height:1rem;pointer-events:none}
.mark::before,.mark::after{content:"";position:absolute;background:var(--faint)}
.mark::before{left:0;right:0;top:50%;height:1px}
.mark::after{top:0;bottom:0;left:50%;width:1px}
.mark.tl{left:-0.5rem;top:-0.5rem}.mark.tr{right:-0.5rem;top:-0.5rem}
.mark.bl{left:-0.5rem;bottom:-0.5rem}.mark.br{right:-0.5rem;bottom:-0.5rem}
.kid{padding:0.65rem 1.2rem 0.75rem;display:flex;flex-direction:column;gap:0.3rem;min-width:0}
.kid + .kid{border-left:1px solid var(--rule)}
.kid .eyebrow{display:flex;gap:.6rem;align-items:baseline}
.kid .eyebrow .g{color:var(--muted);letter-spacing:.14em}
.kid .what{font-family:var(--body);font-weight:600;font-size:1.5rem;line-height:1.15;letter-spacing:-.01em;text-wrap:balance;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.kid .meta{font-family:var(--cond);font-size:1.1rem;color:var(--soft);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.track{height:3px;background:var(--rule);position:relative}
.track i{position:absolute;inset:0 auto 0 0;background:var(--rule-strong);width:0}
.kid .next{font-size:0.9rem;color:var(--muted);padding-top:0.15rem}
.kid .next b{font-family:var(--cond);font-weight:600;letter-spacing:.06em;color:var(--ink);text-transform:uppercase;margin-right:.35rem}

/* ── tags (as in the printed legend) ── */
.tag{font-family:var(--cond);font-weight:600;font-size:0.72rem;letter-spacing:.14em;text-transform:uppercase;padding:0.14rem 0.4rem 0.1rem;line-height:1;white-space:nowrap;display:inline-block;vertical-align:middle;font-style:normal}
.tag.L{background:var(--live-fill);color:var(--live-text)}
.tag.M{background:var(--tint-strong);color:var(--slate-ink)}
.tag.F{border:1px solid var(--slate);color:var(--slate-ink);padding:0.1rem 0.36rem 0.06rem}
.tag.I{border:1px solid var(--faint);color:var(--muted);padding:0.1rem 0.36rem 0.06rem}
.kid .what .tag{font-size:0.8rem}

/* ── day table ── */
.sched{flex:1;min-height:0;display:flex;flex-direction:column;border-top:1px solid var(--rule-strong)}
.cols{display:grid;grid-template-columns:8.4rem 1fr 1fr 0.8fr}
.thead{border-bottom:1px solid var(--rule)}
.thead div{font-family:var(--cond);font-weight:500;font-size:0.82rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);padding:0.5rem 0.9rem 0.45rem}
.thead .tv b,.thead .te b{color:var(--ink);font-weight:600}
#rows{flex:1;min-height:0;overflow-y:auto;position:relative;-webkit-overflow-scrolling:touch}
.row{border-bottom:1px solid var(--rule);transition:opacity .3s}
.time{font-family:var(--cond);font-weight:400;font-size:1.12rem;font-variant-numeric:tabular-nums;color:var(--soft);padding:0.7rem 0.9rem;white-space:nowrap;display:flex;flex-direction:column;gap:0.3rem;align-items:flex-start}
.time .now-tag{display:none;font-family:var(--cond);font-weight:600;font-size:0.72rem;letter-spacing:.2em;padding:0.14rem 0.4rem 0.1rem;background:var(--now-text);color:var(--now-fill)}
.cell{padding:0.6rem 0.9rem 0.65rem;display:flex;flex-direction:column;gap:0.2rem;min-width:0}
.cell .t{display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap}
.cell .title{font-weight:500;font-size:1.05rem;letter-spacing:-.005em}
.cell .sub{color:var(--muted);font-size:0.8rem;line-height:1.35}
.cell.hl{background:var(--tint)}
.cell.hatch{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--hatch) 6px 7px)}
.cell.hatch .title,.cell.quiet .title{color:var(--muted);font-weight:400}
.cell.empty .title{color:var(--faint)}
.cell.both{grid-column:2 / 4}
.cell .together{font-family:var(--cond);font-weight:500;font-size:0.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--slate)}
.cell .lbl{display:none;font-family:var(--cond);font-weight:600;font-size:0.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.note{padding:0.7rem 0.9rem;font-size:0.8rem;color:var(--muted);line-height:1.4}
.row.past{opacity:var(--past)}
.row.current{background:var(--now-row);box-shadow:inset 0 2px 0 var(--rule-strong),inset 0 -2px 0 var(--rule-strong)}
.row.current .time{background:var(--now-fill);color:var(--now-text);font-weight:500}
.row.current .time .now-tag{display:inline-block}

/* ── legend ── */
.foot{display:flex;justify-content:space-between;align-items:center;gap:0.6rem 1.5rem;flex-wrap:wrap;border-top:1px solid var(--rule);padding-top:0.55rem}
.legend{display:flex;gap:1.2rem;flex-wrap:wrap;align-items:center;font-size:0.82rem;color:var(--soft)}
.legend span{display:flex;align-items:center;gap:0.45rem}
.legend .sw{display:inline-block;width:1.4rem;height:0.8rem;border:1px solid var(--rule)}
.legend .sw.hatch{background:repeating-linear-gradient(135deg,transparent 0 3px,var(--faint) 3px 4px)}
.foot .src{font-family:var(--cond);font-size:0.85rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

@media (max-width:1000px){
  .cols{grid-template-columns:7.2rem 1fr 1fr}
  .note,.thead .tn{display:none}
}
@media (max-width:680px){
  .mast{grid-template-columns:1fr}
  .mast-right{align-items:flex-start}
  .facts{text-align:left}
  .dayname{font-size:3.2rem}
  .nowbox{grid-template-columns:1fr}
  .kid + .kid{border-left:0;border-top:1px solid var(--rule)}
  .wrap{height:auto}
  #rows{overflow:visible}
  .thead{display:none}
  .cols{grid-template-columns:4.4rem 1fr}
  .time{white-space:normal;font-size:1rem;padding:0.6rem 0.5rem 0.6rem 0}
  .row .time{grid-row:1 / span 2}
  .cell,.cell.both{grid-column:2}
  .cell.ce{border-top:1px dashed var(--rule)}
  .cell .lbl{display:block}
}
@media (prefers-reduced-motion:reduce){.row{transition:none}}
</style>
</head>

  if(it.h) c.push("hatch"); if(it.q) c.push("quiet"); if(it.empty) c.push("empty");
  if(cls==="ce" && (it.g==="L"||it.g==="F")) c.push("hl");
  return `<div class="${c.join(" ")}">${extra||""}${label?`<span class="lbl">${label}</span>`:""}<div class="t">${tagHTML(it.g)}<span class="title">${esc(it.t)}</span></div>${it.s?`<div class="sub">${esc(it.s)}</div>`:""}</div>`;
}

function renderRows(dayIdx, nowMin, live){
  document.getElementById("rows").innerHTML = WEEK[dayIdx].rows.map(row=>{
    const s=mins(row.s), e=mins(row.e);
    const st = live ? (nowMin>=e?"past":(nowMin>=s?"current":"")) : "";
    const cells = row.b
      ? cellHTML(row.b,"both",null,`<span class="together">Victor &amp; Emma together</span>`)
      : cellHTML(row.v,"cv","Victor")+cellHTML(row.e2,"ce","Emma");
    return `<div class="row cols ${st}"><div class="time"><span>${fmt(row.s)}–${fmt(row.e)}</span><span class="now-tag">Now</span></div>${cells}<div class="note">${esc(row.n)}</div></div>`;
  }).join("");
}

function kidHTML(kid,name,grade,dayIdx,nowMin,weekend){
  const head=`<div class="eyebrow">${name}<span class="g">${grade}</span></div>`;
  if(weekend){
    const first=WEEK[1].rows.find(r=>{const it=itemFor(r,kid);return it&&it.g;});
    return head+`<div class="what">Weekend — no school</div><div class="next"><b>Monday</b>${first?fmtAP(first.s)+" · "+esc(itemFor(first,kid).t):""}</div>`;
  }
  const rows=WEEK[dayIdx].rows; let cur=null,next=null;
  for(const row of rows){
    const s=mins(row.s),e=mins(row.e),it=itemFor(row,kid);
    if(nowMin>=s&&nowMin<e) cur={row,it,s,e};
    else if(s>nowMin&&!next&&it&&!it.empty) next={row,it};
  }
  const nextLine = next?`<div class="next"><b>Next · ${fmtAP(next.row.s)}</b>${esc(next.it.t)}</div>`:"";
  if(cur&&cur.it&&!cur.it.empty){
    const left=cur.e-nowMin, pct=Math.max(0,Math.min(100,(nowMin-cur.s)/(cur.e-cur.s)*100));
    const lt = left>=60?`${Math.floor(left/60)} hr${left%60?" "+left%60+" min":""}`:`${left} min`;
    return head+`<div class="what">${tagHTML(cur.it.g)}<span>${esc(cur.it.t)}</span></div><div class="meta">Until ${fmtAP(cur.row.e)} · ${lt} left</div><div class="track"><i style="width:${pct.toFixed(1)}%"></i></div>`+nextLine;
  }
  if(next) return head+`<div class="what">Not started yet</div>`+nextLine;
  const t=new Date(); t.setDate(t.getDate()+1); const ti=schoolDay(t);
  return head+`<div class="what">Done for the day</div><div class="next"><b>${DAYNAMES[ti]}</b>${esc(WEEK[ti].facts)}</div>`;
}

function render(force){
  const now=new Date(), nowMin=now.getHours()*60+now.getMinutes(), wd=now.getDay();
  const weekend=(wd===0||wd===6), todayIdx=schoolDay(now);
  if(viewDay!==null && Date.now()-lastTouch>120000) viewDay=null;
  const dayIdx=viewDay??todayIdx, live=!weekend&&dayIdx===wd;

  let h=now.getHours(),m=now.getMinutes(); const ap=h>=12?"PM":"AM"; h=h%12||12;
  document.getElementById("clock").innerHTML=`${h}:${String(m).padStart(2,"0")}<small>${ap}</small>`;
  document.getElementById("dayname").textContent=DAYNAMES[dayIdx];
  const dateStr=now.toLocaleDateString(undefined,{month:"long",day:"numeric"});
  const lead = live?`<b>Today</b>, ${esc(dateStr)}`:(weekend&&viewDay===null?`<b>Coming up Monday</b>`:`<b>Preview</b> — back to today shortly`);
  document.getElementById("subline").innerHTML=`${lead} · ${esc(WEEK[dayIdx].facts)}`;

  const banner=document.getElementById("banner");
  banner.hidden=!(weekend&&viewDay===null);
  if(!banner.hidden) banner.textContent=`It's the weekend — here is Monday's schedule.`;

  document.getElementById("days").innerHTML=[1,2,3,4,5].map(d=>`<button type="button" id="day-${d}" data-d="${d}" aria-pressed="${d===dayIdx}" class="${(!weekend&&d===wd)?"is-today":""}">${DAYNAMES[d].slice(0,3)}</button>`).join("");

  const nowSec=document.getElementById("now");
  nowSec.hidden=!(live||(weekend&&viewDay===null));
  if(!nowSec.hidden){
    document.getElementById("card-v").innerHTML=kidHTML("v","Victor","Grade 4",dayIdx,nowMin,weekend);
    document.getElementById("card-e").innerHTML=kidHTML("e","Emma","Grade 10",dayIdx,nowMin,weekend);
  }

  renderRows(dayIdx,nowMin,live);
  const key=`${dayIdx}|${live}|${live?WEEK[dayIdx].rows.findIndex(r=>nowMin<mins(r.e)):0}|${now.toDateString()}`;
  if(force||key!==lastKey){
    lastKey=key;
    const box=document.getElementById("rows"), cur=box.querySelector(".row.current");
    const inner=box.scrollHeight>box.clientHeight+2;
    if(cur){
      if(inner) box.scrollTo({top:Math.max(0,cur.offsetTop-box.clientHeight*0.2),behavior:"smooth"});
      else window.scrollTo({top:Math.max(0,cur.getBoundingClientRect().top+scrollY-innerHeight*0.35),behavior:"smooth"});
    } else if(force){ box.scrollTo({top:0}); }
  }
}

document.getElementById("days").addEventListener("click",e=>{
  const btn=e.target.closest("button[data-d]"); if(!btn) return;
  const d=Number(btn.dataset.d), wd=new Date().getDay();
  viewDay=(d===wd)?null:d; lastTouch=Date.now(); render(true);
});
["pointerdown","keydown"].forEach(ev=>addEventListener(ev,()=>{lastTouch=Date.now();},{passive:true}));

async function keepAwake(){ try{ if("wakeLock" in navigator && document.visibilityState==="visible") await navigator.wakeLock.request("screen"); }catch(_){} }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){keepAwake();render(true);} });
addEventListener("pointerdown",keepAwake,{once:true});
keepAwake();

render(true);
setInterval(()=>render(false),20000);
</script>

</body>
</html>
